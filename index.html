<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ゆうとをつかまえろ！</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #fdf6e2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
      touch-action: manipulation;
    }
    .card {
      background: #ffffff;
      width: 94%;
      max-width: 380px;
      padding: 18px 16px 22px;
      border-radius: 24px;
      border: 3px solid #222;
      box-shadow: 0 8px 0 #222;
      text-align: center;
      position: relative;
    }
    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .sub-badge {
      background: #ff4d6d;
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 99px;
      border: 2px solid #222;
    }
    .bgm-btn {
      background: #f0f0f0;
      border: 2px solid #222;
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: bold;
      cursor: pointer;
      color: #333;
    }
    .bgm-btn.playing {
      background: #ffe3e8;
      color: #ff4d6d;
      border-color: #ff4d6d;
    }
    h1 {
      font-size: 1.25rem;
      line-height: 1.3;
      margin-bottom: 6px;
      color: #222;
    }

    /* 得点ルール説明バー */
    .legend {
      display: flex;
      justify-content: center;
      gap: 8px;
      background: #fff5f7;
      border: 2px solid #ffd0d9;
      border-radius: 12px;
      padding: 6px 8px;
      margin-bottom: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .pt-10 { color: #2b7de9; }
    .pt-30 { color: #d63384; }
    .pt-50 { color: #ff2a55; }

    /* スコア＆タイマー表示 */
    .status-bar {
      display: flex;
      justify-content: space-around;
      background: #222;
      color: #fff;
      padding: 8px 12px;
      border-radius: 14px;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .status-item {
      font-size: 0.85rem;
    }
    .status-val {
      font-size: 1.25rem;
      color: #ffeb3b;
      margin-left: 4px;
    }

    /* 3×3のモグラ叩きグリッド */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .hole {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #e9dec9;
      border-radius: 50%;
      border: 3px solid #222;
      box-shadow: inset 0 6px 0 rgba(0,0,0,0.18);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* 飛び出すゆうとアイコン（1枚の画像から3つの顔を自動切り抜き！） */
    .mole {
      position: absolute;
      inset: 4%;
      border-radius: 50%;
      background-image: url('yuto.png'), url('1000002815.png');
      background-repeat: no-repeat;
      border: 2px solid #222;
      transform: translateY(110%);
      transition: transform 0.11s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    .hole.up .mole {
      transform: translateY(0%);
    }
    .hole.hit .mole {
      transform: scale(0.85) translateY(20%);
      filter: brightness(1.2);
    }

    /* 1枚の画像(2048x2048)内の3つの円にピタリと合わせる座標指定 */
    .mole.type-normal {
      /* 上の青背景（普通） */
      background-size: 232% 232%;
      background-position: 50% 4.5%;
    }
    .mole.type-ero {
      /* 左下のピンク（エロい目） */
      background-size: 215% 215%;
      background-position: 4.2% 95.5%;
    }
    .mole.type-heart {
      /* 右下のピンク（ハート目） */
      background-size: 215% 215%;
      background-position: 95.8% 95.5%;
      box-shadow: 0 0 10px #ff2a55;
    }

    /* タップ時の「+50」ポップアップ文字 */
    .score-pop {
      position: absolute;
      left: 50%;
      top: 20%;
      transform: translateX(-50%);
      font-weight: 900;
      font-size: 1.15rem;
      color: #ff2a55;
      text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
      pointer-events: none;
      animation: floatUp 0.45s ease-out forwards;
      z-index: 10;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      100% { opacity: 0; transform: translate(-50%, -22px) scale(1.15); }
    }

    .start-btn {
      width: 100%;
      background: #ff4d6d;
      color: #fff;
      border: 3px solid #222;
      box-shadow: 0 5px 0 #222;
      padding: 12px;
      border-radius: 99px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .start-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #222;
    }
    .start-btn:disabled {
      background: #ccc;
      color: #666;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 3px 0 #222;
    }

    /* 結果モーダル（上部配置＆誤タップ防止） */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      justify-content: center;
      align-items: flex-start;
      padding: 36px 20px 20px;
      z-index: 100;
    }
    .modal-card {
      background: #fff;
      padding: 22px 20px 26px;
      border-radius: 20px;
      border: 3px solid #222;
      box-shadow: 0 8px 0 #222;
      text-align: center;
      max-width: 320px;
      width: 100%;
      animation: slideDown 0.25s ease-out;
    }
    @keyframes slideDown {
      0% { transform: translateY(-20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .modal-top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }
    .close-btn {
      background: #222;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 99px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .close-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .result-badge {
      display: inline-block;
      padding: 5px 16px;
      border-radius: 99px;
      background: #ffe3e8;
      color: #ff4d6d;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .score-record {
      font-size: 1.05rem;
      color: #555;
      margin-bottom: 14px;
    }
    .score-record span {
      font-weight: bold;
      color: #222;
      font-size: 1.5rem;
    }
    .message-box {
      background: #fafafa;
      border: 2px dashed #ff4d6d;
      border-radius: 12px;
      padding: 18px 14px;
    }
    .msg-text {
      font-size: 1.35rem;
      font-weight: bold;
      color: #222;
      margin-bottom: 10px;
    }
    .reward-text {
      font-size: 1.15rem;
      color: #ff4d6d;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 背景BGM（bgm.mp3 を小音量でループ再生） -->
  <audio id="bgmAudio" src="bgm2.mp3" loop preload="auto" playsinline></audio>

  <div class="card">
    <div class="top-controls">
      <div class="sub-badge">✨ ゆいちゃん限定 ✨</div>
      <button type="button" class="bgm-btn" id="bgmToggleBtn" onclick="toggleBgm()">🎵 BGM: OFF</button>
    </div>

    <h1>ゆうとの気持ち<br>つかみますゲーム</h1>

    <div class="legend">
      <span class="pt-10">😊普通: 10点</span>
      <span class="pt-30">👅エロ目: 30点</span>
      <span class="pt-50">😍ハート(高速): 50点</span>
    </div>

    <div class="status-bar">
      <div class="status-item">残り時間<span class="status-val" id="timeDisplay">15.0</span>秒</div>
      <div class="status-item">スコア<span class="status-val" id="scoreDisplay">0</span>点</div>
    </div>

    <!-- 9個の穴 -->
    <div class="grid" id="grid">
      <div class="hole" onpointerdown="whack(0, event)"><div class="mole" id="mole0"></div></div>
      <div class="hole" onpointerdown="whack(1, event)"><div class="mole" id="mole1"></div></div>
      <div class="hole" onpointerdown="whack(2, event)"><div class="mole" id="mole2"></div></div>
      <div class="hole" onpointerdown="whack(3, event)"><div class="mole" id="mole3"></div></div>
      <div class="hole" onpointerdown="whack(4, event)"><div class="mole" id="mole4"></div></div>
      <div class="hole" onpointerdown="whack(5, event)"><div class="mole" id="mole5"></div></div>
      <div class="hole" onpointerdown="whack(6, event)"><div class="mole" id="mole6"></div></div>
      <div class="hole" onpointerdown="whack(7, event)"><div class="mole" id="mole7"></div></div>
      <div class="hole" onpointerdown="whack(8, event)"><div class="mole" id="mole8"></div></div>
    </div>

    <button type="button" class="start-btn" id="startBtn" onclick="startGame()">スタート！！（15秒勝負）</button>
  </div>

  <!-- 結果モーダル -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-top-bar">
        <button type="button" class="close-btn" id="retryBtn" onclick="closeModal()" disabled>🔄 もう1回挑戦する</button>
      </div>

      <div class="result-badge" id="rankBadge">RANK SSS</div>
      <div class="score-record">獲得スコア: <span id="finalScore">0</span>点</div>
      
      <div class="message-box">
        <div class="msg-text" id="resultMessage">メッセージ</div>
        <div class="reward-text" id="rewardMessage">🎁 ご褒美: ○○</div>
      </div>
    </div>
  </div>

  <script>
    var GAME_DURATION = 15.0; // 15秒勝負
    var score = 0;
    var isPlaying = false;
    var startTime = 0;
    var timerInterval = null;
    var spawnTimer = null;
    var lastHole = -1;

    // 各穴の状態管理
    var holeStates = [];
    for (var i = 0; i < 9; i++) {
      holeStates.push({ active: false, type: 'normal', points: 10, timeout: null });
    }

    // BGM設定（音量15%）
    var audioCtx = null;
    var isBgmStarted = false;
    var bgm = document.getElementById('bgmAudio');
    bgm.volume = 0.15;

    function startBgmIfNeeded() {
      if (!isBgmStarted) {
        bgm.volume = 0.15;
        bgm.play().then(function() {
          isBgmStarted = true;
          updateBgmButton(true);
        }).catch(function() {});
      }
    }

    function toggleBgm() {
      bgm.volume = 0.15;
      if (bgm.paused) {
        bgm.play().then(function() {
          isBgmStarted = true;
          updateBgmButton(true);
        }).catch(function() {});
      } else {
        bgm.pause();
        updateBgmButton(false);
      }
    }

    function updateBgmButton(playing) {
      var btn = document.getElementById('bgmToggleBtn');
      if (playing) {
        btn.textContent = '🎵 BGM: ON';
        btn.classList.add('playing');
      } else {
        btn.textContent = '🎵 BGM: OFF';
        btn.classList.remove('playing');
      }
    }

    function initAudio() {
      if (!audioCtx) {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 捕まえた時の効果音（普通・エロ目・ハート目で音が変わる！）
    function playHitSound(points) {
      if (!audioCtx) return;
      var now = audioCtx.currentTime;
      if (points === 50) {
        // ハート目：高音キラキラ2連音！
        playTone(783.99, 0.07, 0, 'triangle');
        playTone(1046.50, 0.15, 0.06, 'triangle');
      } else if (points === 30) {
        // エロ目：ちょっと艶っぽい中音チャイム
        playTone(587.33, 0.12, 0, 'sine');
      } else {
        // 普通：軽快なポップ音
        playTone(440.00, 0.09, 0, 'sine');
      }
    }

    function playTone(freq, dur, delay, type) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + dur);
    }

    // 終了時のランク別ファンファーレ
    function playClearSound(rankLevel) {
      if (!audioCtx) return;
      var notes = [];
      if (rankLevel === 3) {
        notes = [
          { f: 523.25, d: 0.08, t: 0.0, type: 'triangle' },
          { f: 659.25, d: 0.08, t: 0.09, type: 'triangle' },
          { f: 783.99, d: 0.08, t: 0.18, type: 'triangle' },
          { f: 1046.50, d: 0.12, t: 0.27, type: 'triangle' },
          { f: 783.99, d: 0.08, t: 0.40, type: 'triangle' },
          { f: 1046.50, d: 0.45, t: 0.50, type: 'triangle' }
        ];
      } else if (rankLevel === 2) {
        notes = [
          { f: 440.00, d: 0.1, t: 0.0, type: 'sine' },
          { f: 554.37, d: 0.1, t: 0.1, type: 'sine' },
          { f: 659.25, d: 0.1, t: 0.2, type: 'sine' },
          { f: 880.00, d: 0.35, t: 0.3, type: 'sine' }
        ];
      } else if (rankLevel === 1) {
        notes = [
          { f: 523.25, d: 0.15, t: 0.0, type: 'sine' },
          { f: 659.25, d: 0.35, t: 0.16, type: 'sine' }
        ];
      } else {
        notes = [
          { f: 246.94, d: 0.18, t: 0.0, type: 'sawtooth' },
          { f: 196.00, d: 0.40, t: 0.20, type: 'sawtooth' }
        ];
      }
      notes.forEach(function(n) {
        playTone(n.f, n.d, n.t, n.type);
      });
    }

    function startGame() {
      if (isPlaying) return;
      initAudio();
      startBgmIfNeeded();

      score = 0;
      isPlaying = true;
      document.getElementById('scoreDisplay').textContent = '0';
      document.getElementById('timeDisplay').textContent = GAME_DURATION.toFixed(1);
      document.getElementById('startBtn').disabled = true;
      document.getElementById('startBtn').textContent = 'つかまえろ！！🔥';

      startTime = Date.now();
      timerInterval = setInterval(function() {
        var elapsed = (Date.now() - startTime) / 1000;
        var remain = Math.max(GAME_DURATION - elapsed, 0);
        document.getElementById('timeDisplay').textContent = remain.toFixed(1);

        if (remain <= 0) {
          endGame();
        }
      }, 50);

      scheduleNextSpawn();
    }

    function scheduleNextSpawn() {
      if (!isPlaying) return;
      var elapsed = (Date.now() - startTime) / 1000;
      // 後半になるほど出現間隔が短くなる（380ms〜240ms）
      var nextDelay = elapsed > 10 ? 250 : 370;

      spawnTimer = setTimeout(function() {
        spawnMole();
        scheduleNextSpawn();
      }, nextDelay);
    }

    function spawnMole() {
      if (!isPlaying) return;

      // 空いている穴を探す
      var available = [];
      for (var i = 0; i < 9; i++) {
        if (!holeStates[i].active && i !== lastHole) {
          available.push(i);
        }
      }
      if (available.length === 0) return;

      var idx = available[Math.floor(Math.random() * available.length)];
      lastHole = idx;

      // キャラ抽選（普通:50%、エロ目:30%、ハート目:20%）
      var rand = Math.random();
      var type = 'type-normal';
      var pts = 10;
      var stayTime = 850; // 普通は0.85秒

      if (rand >= 0.80) {
        // ハート目：50点・超高速（0.48秒で引っ込む！）
        type = 'type-heart';
        pts = 50;
        stayTime = 480;
      } else if (rand >= 0.50) {
        // エロい目：30点・ちょい速（0.65秒）
        type = 'type-ero';
        pts = 30;
        stayTime = 650;
      }

      var holeEl = document.getElementsByClassName('hole')[idx];
      var moleEl = document.getElementById('mole' + idx);

      moleEl.className = 'mole ' + type;
      holeEl.classList.remove('hit');
      holeEl.classList.add('up');

      holeStates[idx].active = true;
      holeStates[idx].points = pts;

      holeStates[idx].timeout = setTimeout(function() {
        holeEl.classList.remove('up');
        holeStates[idx].active = false;
      }, stayTime);
    }

    function whack(idx, e) {
      if (e) e.preventDefault();
      if (!isPlaying) return;
      var state = holeStates[idx];
      if (!state.active) return;

      // 捕獲成功！
      state.active = false;
      clearTimeout(state.timeout);

      var pts = state.points;
      score += pts;
      document.getElementById('scoreDisplay').textContent = score;

      playHitSound(pts);

      var holeEl = document.getElementsByClassName('hole')[idx];
      holeEl.classList.remove('up');
      holeEl.classList.add('hit');

      // 「+50」などのポップアップ表示
      var pop = document.createElement('div');
      pop.className = 'score-pop';
      pop.textContent = '+' + pts;
      holeEl.appendChild(pop);
      setTimeout(function() {
        if (pop.parentNode) pop.parentNode.removeChild(pop);
      }, 450);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      clearTimeout(spawnTimer);

      // 全ての穴を引っ込める
      var holes = document.getElementsByClassName('hole');
      for (var i = 0; i < 9; i++) {
        holes[i].classList.remove('up');
        clearTimeout(holeStates[i].timeout);
        holeStates[i].active = false;
      }

      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = 'スタート！！（15秒勝負）';

      // スコアによる4段階ご褒美判定！
      var rank = '';
      var msg = '';
      var reward = '';
      var rankLevel = 0;

      if (score >= 350) {
        rank = 'RANK SSS 🔥';
        msg = '特別やで';
        reward = '🎁 ご褒美: 添い寝';
        rankLevel = 3;
      } else if (score >= 250) {
        rank = 'RANK S ✨';
        msg = 'こっちこいよ';
        reward = '🎁 ご褒美: ハグ';
        rankLevel = 2;
      } else if (score >= 150) {
        rank = 'RANK A 👍';
        msg = 'よく頑張ったね！';
        reward = '🎁 ご褒美: ナデナデ';
        rankLevel = 1;
      } else {
        rank = 'RANK B 💦';
        msg = 'やる気出そうぜ';
        reward = '🎁 ご褒美: なし';
        rankLevel = 0;
      }

      document.getElementById('rankBadge').textContent = rank;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('resultMessage').textContent = msg;
      document.getElementById('rewardMessage').textContent = reward;

      setTimeout(function() {
        playClearSound(rankLevel);
      }, 150);

      // モーダル表示＆1秒間ロックして誤タップ防止
      var retryBtn = document.getElementById('retryBtn');
      retryBtn.disabled = true;

      setTimeout(function() {
        document.getElementById('modal').style.display = 'flex';
        setTimeout(function() {
          retryBtn.disabled = false;
        }, 1000);
      }, 200);
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
